global:
  smtp_smarthost: "localhost:587"
  smtp_from: "alertmanager@example.com"

route:
  receiver: "default"
  group_by: ["alertname", "cluster"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "default"
    email_configs:
      - to: "ops@example.com"
        send_resolved: true